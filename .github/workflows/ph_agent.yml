name: PH Ride-Hailing Competitor Agent

on:
  schedule:
    - cron: '0 1 1-31/2 * *'  # Chạy quét tin mỗi 2 ngày lúc 08:00 sáng giờ VN
    - cron: '30 1 1,15 * *'   # Chạy tổng hợp báo cáo 2 tuần vào ngày 1 và 15 lúc 08:30 sáng giờ VN
  workflow_dispatch:
    inputs:
      mode:
        description: 'Chọn chế độ chạy thủ công (collect hoặc overview)'
        required: true
        default: 'collect'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create service_account.json
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: echo "$GCP_SA_KEY" > service_account.json

      - name: Run 2-Day Data Collection
        if: github.event.schedule == '0 1 1-31/2 * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'collect')
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_NAME: PH_RideHailing_Competitor_Tracking
          SHEET_URL: ${{ secrets.SHEET_URL }}
        run: python main.py collect

      - name: Run Bi-Weekly Overview
        if: github.event.schedule == '30 1 1,15 * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'overview')
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          SHEET_NAME: PH_RideHailing_Competitor_Tracking
          SHEET_URL: ${{ secrets.SHEET_URL }}
        run: python main.py overview
